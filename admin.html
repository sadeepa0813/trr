<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&K Admin Suite</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-90 z-50">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Admin Login</h2>
                <p class="text-gray-400 mt-2">Default: admin / admin123</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <input type="text" id="username" placeholder="Username" 
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white" 
                       value="admin">
                <input type="password" id="password" placeholder="Password" 
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white"
                       value="admin123">
                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">
                <i class="fas fa-chart-line text-indigo-400 mr-3"></i>
                M&K Admin Dashboard
            </h1>
            <button onclick="logout()" 
                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Total Orders</p>
                        <h3 class="text-2xl font-bold text-white" id="total-orders">0</h3>
                    </div>
                    <i class="fas fa-shopping-cart text-3xl text-blue-400 opacity-50"></i>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Total Revenue</p>
                        <h3 class="text-2xl font-bold text-emerald-400" id="total-revenue">Rs. 0</h3>
                    </div>
                    <i class="fas fa-wallet text-3xl text-emerald-400 opacity-50"></i>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Paid Amount</p>
                        <h3 class="text-2xl font-bold text-green-400" id="paid-amount">Rs. 0</h3>
                    </div>
                    <i class="fas fa-check-circle text-3xl text-green-400 opacity-50"></i>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Pending Amount</p>
                        <h3 class="text-2xl font-bold text-orange-400" id="pending-amount">Rs. 0</h3>
                    </div>
                    <i class="fas fa-clock text-3xl text-orange-400 opacity-50"></i>
                </div>
            </div>
        </div>
        
        <!-- Bookings Table -->
        <div class="glass rounded-xl overflow-hidden">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">
                    <i class="fas fa-table-list mr-2"></i> All Bookings
                </h2>
                <div class="flex gap-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                        <input type="text" id="search-input" 
                               placeholder="Search bookings..." 
                               class="bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-4 py-2 text-white w-64">
                    </div>
                    <button onclick="loadBookings()" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="p-4 text-left text-gray-300">Date</th>
                            <th class="p-4 text-left text-gray-300">Customer</th>
                            <th class="p-4 text-left text-gray-300">Package</th>
                            <th class="p-4 text-left text-gray-300">Amount</th>
                            <th class="p-4 text-left text-gray-300">Status</th>
                            <th class="p-4 text-left text-gray-300">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-table" class="divide-y divide-gray-800">
                        <!-- Data will load here -->
                    </tbody>
                </table>
            </div>
            
            <div id="no-data" class="hidden p-8 text-center text-gray-500">
                <i class="fas fa-inbox text-4xl mb-4 opacity-50"></i>
                <p>No bookings found</p>
            </div>
        </div>
    </div>

    <script>
        // Google Apps Script URL (මෙම එකම URL එක index.html වලත් තියෙනවා)
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwFAmhMVvff_k2WM1ES2PWx5DePuiaIE94pW1DhwbgRkfFF8KRz7AcDeRKL--aaUU_qTQ/exec';
        
        // Admin credentials
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = 'admin123';
        
        // Check login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === ADMIN_USER && password === ADMIN_PASS) {
                localStorage.setItem('admin_logged_in', 'true');
                showDashboard();
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: 'Invalid username or password',
                    background: '#1e293b',
                    color: '#fff'
                });
            }
        });
        
        // Show dashboard if already logged in
        function checkLogin() {
            if (localStorage.getItem('admin_logged_in') === 'true') {
                showDashboard();
            }
        }
        
        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadBookings();
        }
        
        function logout() {
            localStorage.removeItem('admin_logged_in');
            location.reload();
        }
        
        // Load bookings from Google Sheets
        async function loadBookings() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const bookings = await response.json();
                
                if (!Array.isArray(bookings)) {
                    throw new Error('Invalid data format received');
                }
                
                updateStats(bookings);
                renderBookingsTable(bookings);
                
            } catch (error) {
                console.error('Error loading bookings:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Failed to load bookings. Make sure the Google Sheet is published correctly.',
                    background: '#1e293b',
                    color: '#fff'
                });
            }
        }
        
        // Update statistics
        function updateStats(bookings) {
            const totalOrders = bookings.length;
            const totalRevenue = bookings.reduce((sum, booking) => sum + (parseInt(booking.total) || 0), 0);
            
            const paidBookings = bookings.filter(b => b.status === 'Paid');
            const paidAmount = paidBookings.reduce((sum, booking) => sum + (parseInt(booking.total) || 0), 0);
            
            const pendingAmount = totalRevenue - paidAmount;
            
            document.getElementById('total-orders').textContent = totalOrders;
            document.getElementById('total-revenue').textContent = 'Rs. ' + totalRevenue.toLocaleString();
            document.getElementById('paid-amount').textContent = 'Rs. ' + paidAmount.toLocaleString();
            document.getElementById('pending-amount').textContent = 'Rs. ' + pendingAmount.toLocaleString();
        }
        
        // Render bookings table
        function renderBookingsTable(bookings) {
            const tbody = document.getElementById('bookings-table');
            const noData = document.getElementById('no-data');
            
            if (bookings.length === 0) {
                tbody.innerHTML = '';
                noData.classList.remove('hidden');
                return;
            }
            
            noData.classList.add('hidden');
            
            // Sort by date (newest first)
            bookings.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let html = '';
            bookings.forEach(booking => {
                const isPaid = booking.status === 'Paid';
                
                html += `
                    <tr class="hover:bg-gray-800 transition">
                        <td class="p-4">
                            <div class="text-white">${booking.date || 'N/A'}</div>
                            <div class="text-sm text-gray-400">${booking.time || ''}</div>
                        </td>
                        <td class="p-4">
                            <div class="font-medium text-white">${booking.name || 'N/A'}</div>
                            <div class="text-sm text-gray-400">${booking.contact || ''}</div>
                        </td>
                        <td class="p-4 text-indigo-300">${booking.package || 'N/A'}</td>
                        <td class="p-4 font-bold text-white">Rs. ${(parseInt(booking.total) || 0).toLocaleString()}</td>
                        <td class="p-4">
                            <button onclick="updateStatus('${booking.id}', ${isPaid})" 
                                    class="px-3 py-1 rounded-full text-xs font-bold ${isPaid ? 'bg-green-500/20 text-green-400 border border-green-500/20' : 'bg-orange-500/20 text-orange-400 border border-orange-500/20'}">
                                ${isPaid ? 'Paid' : 'Unpaid'}
                            </button>
                        </td>
                        <td class="p-4">
                            <div class="flex gap-2">
                                <a href="https://wa.me/94${(booking.contact || '').replace(/^0/, '')}" 
                                   target="_blank"
                                   class="w-8 h-8 rounded-lg bg-green-500/10 text-green-400 hover:bg-green-500 hover:text-white flex items-center justify-center">
                                    <i class="fab fa-whatsapp"></i>
                                </a>
                                <button onclick="deleteBooking('${booking.id}')"
                                        class="w-8 h-8 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            
            // Add search functionality
            document.getElementById('search-input').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = bookings.filter(booking => 
                    (booking.name || '').toLowerCase().includes(searchTerm) ||
                    (booking.contact || '').includes(searchTerm) ||
                    (booking.package || '').toLowerCase().includes(searchTerm)
                );
                renderBookingsTable(filtered);
            });
        }
        
        // Update payment status (Note: Google Sheets API doesn't allow direct updates via GET/POST)
        function updateStatus(recordId, currentStatus) {
            Swal.fire({
                title: 'Update Status',
                text: 'Google Sheets වෙනස් කිරීමට ඔබට සෘජුවම Google Sheet එකට ගොස් update කල යුතුය.',
                icon: 'info',
                confirmButtonText: 'OK',
                background: '#1e293b',
                color: '#fff'
            });
        }
        
        // Delete booking (Note: Google Sheets API doesn't allow deletes via GET/POST)
        function deleteBooking(recordId) {
            Swal.fire({
                title: 'Delete Booking',
                text: 'Google Sheets වෙනස් කිරීමට ඔබට සෘජුවම Google Sheet එකට ගොස් delete කල යුතුය.',
                icon: 'info',
                confirmButtonText: 'OK',
                background: '#1e293b',
                color: '#fff'
            });
        }
        
        // Check login on page load
        document.addEventListener('DOMContentLoaded', checkLogin);
    </script>
</body>
</html>
