<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&K Promotions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; }
        .package { background: #1e293b; padding: 20px; margin: 10px; border-radius: 10px; }
    </style>
</head>
<body class="p-4">

    <h1 class="text-3xl font-bold mb-6">M&K Promotions</h1>
    
    <div class="package">
        <h3 class="text-xl font-bold text-blue-400">Basic Package</h3>
        <p class="text-gray-400">12K+ Followers | 3K+ Channel</p>
        <div class="text-2xl font-bold my-2">Rs. 500</div>
        <button onclick="bookNow('Basic Package', 500)" 
                class="bg-green-600 text-white px-4 py-2 rounded-lg w-full mt-2">
            Book Now
        </button>
    </div>
    
    <!-- Booking Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center">
        <div class="bg-gray-800 p-6 rounded-xl w-96">
            <h2 class="text-xl font-bold mb-4">Booking Details</h2>
            <input type="text" id="name" placeholder="Your Name" class="w-full p-2 mb-2 rounded bg-gray-700">
            <input type="tel" id="phone" placeholder="WhatsApp Number" class="w-full p-2 mb-2 rounded bg-gray-700">
            <input type="date" id="date" class="w-full p-2 mb-2 rounded bg-gray-700">
            <input type="time" id="time" class="w-full p-2 mb-2 rounded bg-gray-700">
            <button onclick="submitBooking()" class="bg-green-600 text-white w-full p-2 rounded">
                Confirm Booking
            </button>
        </div>
    </div>

    <script>
        let currentPackage = '';
        let currentPrice = 0;
        
        function bookNow(pkg, price) {
            currentPackage = pkg;
            currentPrice = price;
            document.getElementById('modal').classList.remove('hidden');
            
            // Set default date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('date').value = tomorrow.toISOString().split('T')[0];
            
            // Set default time to 10 AM
            document.getElementById('time').value = '10:00';
        }
        
        async function submitBooking() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            
            if (!name || !phone) {
                alert('Please fill all fields');
                return;
            }
            
            // 1. Save to Google Sheets
            try {
                await fetch('YOUR_GOOGLE_SCRIPT_URL', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        package: currentPackage,
                        price: currentPrice,
                        date: date,
                        time: time
                    })
                });
            } catch (e) {
                console.log('Google Sheets save attempted');
            }
            
            // 2. Open WhatsApp
            const message = `🎯 *NEW BOOKING* 🎯
            
📦 Package: ${currentPackage}
💰 Price: Rs. ${currentPrice}
👤 Name: ${name}
📞 Phone: ${phone}
📅 Date: ${date}
⏰ Time: ${time}
            
Please confirm this booking.`;
            
            const encoded = encodeURIComponent(message);
            window.open(`https://wa.me/94775048455?text=${encoded}`, '_blank');
            
            // 3. Close modal
            document.getElementById('modal').classList.add('hidden');
            
            // 4. Show success
            alert('✅ Booking submitted! Check WhatsApp.');
        }
    </script>
</body>
</html>
